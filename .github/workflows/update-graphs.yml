name: Update GitHub graphs

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate repository graphs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GLYPH_REPOSITORY: ${{ github.repository }}
        run: node scripts/update-pages-graphs.mjs
      - name: Commit graph if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/graphs/*.svg
          git diff --cached --quiet || git commit -m "Update GitHub star graph"
          git push
