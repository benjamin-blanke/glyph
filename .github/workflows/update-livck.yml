name: Update Livck badge

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Livck status
        env:
          LIVCK_STATUS_URL: https://status.waveserv.com
        run: node scripts/update-livck-badge.mjs
      - name: Commit changed badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/livck.svg
          git diff --cached --quiet || git commit -m "Update Livck status badge"
          git push
